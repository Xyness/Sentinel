name: sentinel

volumes:
  kafka-data:
  features-data:
  checkpoint-data:
  model-data:
  predictions-data:

services:

  # Infrastructure

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    environment:
      # KRaft: the broker is its own controller and there is no Zookeeper to
      # run, wait for or report on. One service and 512 MB less than the
      # ensemble it replaces, and Zookeeper is on its way out of Kafka anyway.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      # Named rather than left anonymous. The image declares this path as a
      # volume, so Compose was quietly keeping one across recreations, and a
      # broker's stored cluster id has to match the one it is started with.
      # Coming from the Zookeeper version of this file, that id will not match
      # and Kafka refuses to start: `docker compose down -v` once and it is
      # gone. An anonymous volume makes that invisible.
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Data pipeline

  data-generator:
    build:
      context: .
      dockerfile: docker/Dockerfile-generator
    container_name: data-generator
    environment:
      - DATA_SOURCE=${DATA_SOURCE:-simulated}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=crypto-market
      - EVENT_FREQUENCY_SECONDS=${EVENT_FREQUENCY_SECONDS:-1}
      - ANOMALY_PROBABILITY=${ANOMALY_PROBABILITY:-0.00085}
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile-spark
    container_name: spark
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=crypto-market
      - OUTPUT_PATH=/data/features
      - CHECKPOINT_PATH=/data/checkpoints/sentinel
      - WINDOW_DURATION=${WINDOW_DURATION:-1 minute}
      - MIN_EVENTS_PER_WINDOW=${MIN_EVENTS_PER_WINDOW:-10}
    volumes:
      - features-data:/data/features
      - checkpoint-data:/data/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4040:4040"
    command: >
      spark-submit
        --class com.sentinel.streaming.CryptoStreamJob
        --master local[*]
        --conf spark.sql.streaming.stateStore.minDeltasForSnapshot=1
        --conf spark.driver.extraJavaOptions=-Dlog4j.logger.org.apache.spark.sql.execution.streaming.state=ERROR
        /opt/spark-apps/app.jar
    healthcheck:
      test: ["CMD-SHELL", "find /data/features -name '*.parquet' | head -1 | grep -q ."]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ML training

  ml-training:
    build:
      context: .
      dockerfile: docker/Dockerfile-ml
    container_name: ml-training
    environment:
      - FEATURES_PATH=/data/features
      - MODEL_PATH=/models/isolation_forest.joblib
      - MIN_PARQUET_FILES=${MIN_PARQUET_FILES:-3}
      - CHECK_INTERVAL_SECONDS=15
      - MAX_WAIT_SECONDS=600
      # Keeps running and refits as the feature store grows. The first model out
      # of a cold stack has seen two minutes of market. Set it to 0 to train
      # once and exit.
      - RETRAIN_INTERVAL_SECONDS=${RETRAIN_INTERVAL_SECONDS:-300}
      - CONTAMINATION=${CONTAMINATION:-0.05}
    volumes:
      - features-data:/data/features:ro
      - model-data:/models
    depends_on:
      spark:
        condition: service_healthy
      data-generator:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Serving

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile-api
    container_name: api
    environment:
      - MODEL_PATH=/models/isolation_forest.joblib
      - PREDICTIONS_DB=/data/predictions/predictions.db
    volumes:
      - model-data:/models:ro
      - predictions-data:/data/predictions
    ports:
      - "8000:8000"
    depends_on:
      - ml-training
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  scorer:
    build:
      context: .
      dockerfile: docker/Dockerfile-scorer
    container_name: scorer
    environment:
      - API_BASE_URL=http://api:8000
      - FEATURES_PATH=/data/features
      - SCORE_INTERVAL_SECONDS=${SCORE_INTERVAL_SECONDS:-15}
    volumes:
      - features-data:/data/features:ro
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
