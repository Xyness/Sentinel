name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install dependencies
        run: pip install -r tests/requirements.txt
      - name: Test
        # The suites add api/, data-generator/ and cli/ to sys.path themselves,
        # so they run from the repo root with no extra install step.
        run: pytest -v

  spark:
    name: Spark Streaming (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Test
        working-directory: spark-java
        run: mvn -B test
      - name: Package
        working-directory: spark-java
        run: mvn -B package -DskipTests

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python, spark]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build all service images
        run: docker compose build
